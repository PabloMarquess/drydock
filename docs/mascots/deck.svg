<svg xmlns="http://www.w3.org/2000/svg" width="272" height="224" viewBox="0 0 34 28" shape-rendering="crispEdges" role="img" aria-label="deck mascot"><style>
.run .la{animation:st .6s steps(1) infinite}.run .lb{animation:st .6s steps(1) infinite -.3s}
.run .bd{animation:bob .6s steps(1) infinite -.15s}
@keyframes st{50%{transform:translateY(-1px)}}@keyframes bob{50%{transform:translateY(1px)}}
@media (prefers-reduced-motion: reduce){.run .la,.run .lb,.run .bd{animation:none}}
</style><g class="run"><g class="bd"><rect x="7" y="10" width="16" height="12" fill="#D97757"/><rect x="3" y="14" width="4" height="4" fill="#D97757"/><rect x="23" y="14" width="4" height="4" fill="#D97757"/><rect x="9" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="19" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="8" y="6" width="14" height="1" fill="#D6D0C2"/><rect x="6" y="7" width="2" height="1" fill="#D6D0C2"/><rect x="22" y="7" width="2" height="1" fill="#D6D0C2"/><rect x="5" y="8" width="1" height="3" fill="#D6D0C2"/><rect x="24" y="8" width="1" height="3" fill="#D6D0C2"/><rect x="4" y="10" width="3" height="4" fill="#24304F"/><rect x="23" y="10" width="3" height="4" fill="#24304F"/><rect x="5" y="11" width="1" height="2" fill="#3D4B75"/><rect x="24" y="11" width="1" height="2" fill="#3D4B75"/><rect x="6" y="14" width="1" height="2" fill="#24304F"/><rect x="7" y="16" width="4" height="1" fill="#24304F"/><rect x="11" y="15" width="2" height="2" fill="#3D4B75"/></g><g class="la"><rect x="7" y="22" width="2" height="4" fill="#D97757"/><rect x="17" y="22" width="2" height="4" fill="#D97757"/></g><g class="lb"><rect x="11" y="22" width="2" height="4" fill="#D97757"/><rect x="21" y="22" width="2" height="4" fill="#D97757"/></g></g></svg>